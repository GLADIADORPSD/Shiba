name: Shiba editor checks
on:
  pull_request:
    paths:
      - 'editor/**'
      - '.github/workflows/editor-checks.yml'
  push:
    branches: [main]
    paths:
      - 'editor/**'
      - '.github/workflows/editor-checks.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix editor test
